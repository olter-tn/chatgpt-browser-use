name: Temporary E30 asset transfer
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/temp-e30-assets.yml'
permissions:
  contents: read
jobs:
  get:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Download CC BY BMW M3 E30 asset and CC0 environment
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p bundle
          curl -fL --retry 4 https://raw.githubusercontent.com/ahnuchen/auto-atlas/master/public/models/free_bmw_m3_e30.glb -o bundle/optimized_bmw_e30.glb
          curl -fL --retry 4 https://raw.githubusercontent.com/SulemanAsif0911/BMW-M3-History/main/m3-e30.glb -o bundle/alternate_e30.glb || true
          curl -fL --retry 3 'https://dl.polyhaven.org/file/ph-assets/HDRIs/hdr/1k/twilight_sunset_1k.hdr' -o bundle/twilight_sunset_1k.hdr || true
          ls -lh bundle/*
          node --version
          npm install --no-audit --no-fund --prefix ./gltf @gltf-transform/cli@4.3.0
          ./gltf/node_modules/.bin/gltf-transform copy bundle/optimized_bmw_e30.glb bundle/bmw_e30_decoded.glb
          ls -lh bundle/bmw_e30_decoded.glb
          cat > bundle/ATTRIBUTION.txt <<'EOF'
          BMW M3 E30 (1986–1991) original 3D model: Martin Trafas (TinoD2)
          Source: https://sketchfab.com/3d-models/free-bmw-m3-e30-ac3c7013434e403e8faff87948caf422
          License: CC BY 4.0, https://creativecommons.org/licenses/by/4.0/
          Model repackaged/optimized by https://github.com/ahnuchen/auto-atlas
          Modifications for scene: geometry transforms, dark body materials, lighting, animation.
          Twilight Sunset HDRI, Poly Haven, CC0: https://polyhaven.com/a/twilight_sunset
          EOF
          tar -czf e30-assets.tar.gz -C bundle .
          ls -lh e30-assets.tar.gz
      - name: Upload asset pack
        uses: actions/upload-artifact@v4
        with:
          name: e30-asset-pack
          path: e30-assets.tar.gz
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
