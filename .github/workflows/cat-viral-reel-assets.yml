name: Download CC0 footage for cat reel
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/cat-viral-reel-assets.yml'
permissions:
  contents: read
jobs:
  media:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Retrieve two CC0 Wikimedia Commons cat videos
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cat-assets
          curl --fail --location --retry 3 --retry-delay 3 --connect-timeout 15 --max-time 180 \
            --user-agent 'CatReelMaker/1.0 (https://github.com/olter-tn/chatgpt-browser-use)' \
            'https://upload.wikimedia.org/wikipedia/commons/c/c6/Moomin1.webm' \
            -o cat-assets/moomin.webm
          curl --fail --location --retry 3 --retry-delay 3 --connect-timeout 15 --max-time 180 \
            --user-agent 'CatReelMaker/1.0 (https://github.com/olter-tn/chatgpt-browser-use)' \
            'https://upload.wikimedia.org/wikipedia/commons/0/07/Cat_Jumpscare.webm' \
            -o cat-assets/jumpscare.webm
          ffprobe -v error -show_entries format=duration,size -of json cat-assets/moomin.webm
          ffprobe -v error -show_entries format=duration,size -of json cat-assets/jumpscare.webm
          cat > cat-assets/credits.txt <<'EOF'
          Moomin1.webm — Tet — CC0 1.0 — https://commons.wikimedia.org/wiki/File:Moomin1.webm
          Cat Jumpscare.webm — Panini! — CC0 1.0 — https://commons.wikimedia.org/wiki/File:Cat_Jumpscare.webm
          EOF
          ls -lah cat-assets
      - name: Upload cat footage
        uses: actions/upload-artifact@v4
        with:
          name: viral-cat-reel-source
          path: cat-assets/
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
