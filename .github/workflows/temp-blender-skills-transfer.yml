name: Temporary transfer Scenario Blender expert agent skills
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/temp-blender-skills-transfer.yml'
permissions:
  contents: read
jobs:
  package-skills:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fetch upstream expert skills and package them
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/scenario-labs/skills.git upstream
          mkdir -p bundle
          cp -a upstream/skills/dcc/blender/scenario-blender-* bundle/
          cp upstream/skills/dcc/blender/README.md bundle/UPSTREAM_BLENDER_README.md
          cp upstream/LICENSE bundle/UPSTREAM_LICENSE 2>/dev/null || true
          git -C upstream rev-parse HEAD > bundle/UPSTREAM_COMMIT
          find bundle -type f | sort > bundle/FILE_MANIFEST
          tar -czf blender-expert-skills.tar.gz -C bundle .
          du -h blender-expert-skills.tar.gz
          test "$(find bundle -mindepth 1 -maxdepth 1 -type d -name 'scenario-blender-*' | wc -l)" -eq 15
      - name: Upload skills package
        uses: actions/upload-artifact@v4
        with:
          name: scenario-blender-expert-skills
          path: blender-expert-skills.tar.gz
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
