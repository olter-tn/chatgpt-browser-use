name: Source licensed moving cat footage and narration
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/viral-cat-reel-assets.yml'
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download Pexels free stock cat footage
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p footage
          cat > /tmp/download.py <<'PY'
          import re, json, time, urllib.request
          cats=[
            ("cute",4884063,30,"vertical"),
            ("play",6864989,25,"vertical"),
            ("bond",35701532,30,"vertical"),
            ("explore",14863819,25,"vertical"),
            ("sleep",38812017,30,"vertical"),
            ("rest",17980371,60,"vertical"),
            ("toy",6864992,25,"horizontal"),
            ("twocats",10295142,30,"horizontal"),
            ("pet",855029,30,"horizontal")
          ]
          results=[]
          for name,vid,fps,mode in cats:
              urls=[]
              try:
                  url=f"https://www.pexels.com/video/{vid}/"
                  request=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"})
                  with urllib.request.urlopen(request,timeout=17) as r: html=r.read().decode('utf8','ignore')
                  urls=list(dict.fromkeys(re.findall(r'https?:\\?/\\?/videos\\?.pexels\\?.com\\?/video-files\\?/[^"\\\s<>]+?\\.mp4',html)))
                  urls=[u.replace("\\/","/").replace("\\","") for u in urls]
                  print("html urls",vid,len(urls), flush=True)
              except Exception as e: print("html error",vid,str(e)[:120],flush=True)
              ar=[(1080,1920),(540,960),(360,640),(720,1280)] if mode=="vertical" else [(1920,1080),(960,540),(640,360)]
              for fw,fh in ar:
                  for qual in ["hd","sd"]:
                      urls.append(f"https://videos.pexels.com/video-files/{vid}/{vid}-{qual}_{fw}_{fh}_{fps}fps.mp4")
              got=False
              for url in urls[:23]:
                  try:
                      req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0","Referer":"https://www.pexels.com/"})
                      with urllib.request.urlopen(req,timeout=15) as r:
                          blob=r.read(26000000)
                      if b'ftyp' not in blob[:64] or len(blob)<100000:
                          raise ValueError("not MP4")
                      open(f"footage/{name}.mp4","wb").write(blob)
                      results.append({"file":name+".mp4","source":f"https://www.pexels.com/video/{vid}/","license":"Pexels free license"})
                      print("SUCCESS",name,len(blob),url,flush=True)
                      got=True
                      break
                  except Exception as e:
                      print("miss",name,str(e)[:65],flush=True)
              if not got: print("no source",name,flush=True)
          with open("footage/sources.json","w") as f:json.dump(results,f,indent=2)
          print("Total",len(results),flush=True)
          if len(results)<3: raise RuntimeError("Insufficient footage")
          PY
          python /tmp/download.py
      - name: Narration with neutral voice
        run: |
          set -euxo pipefail
          python3 -m pip install --quiet gTTS
          mkdir -p audio
          python3 - <<'PY'
          from gtts import gTTS
          text="Cats are terrible roommates. They attack everything. They judge you. And they steal your favorite spot. But then? They look at you like this. And you forgive absolutely everything."
          gTTS(text,lang="en",slow=False).save("audio/voice.mp3")
          with open("audio/script.txt","w") as f:f.write(text)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: viral-cats-motion-assets
          path: |
            footage/
            audio/
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
