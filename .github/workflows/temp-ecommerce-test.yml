name: Ecommerce caption review
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/temp-ecommerce-test.yml'
permissions:
  contents: read
  actions: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: W2pwIKgQeWM-test-source
          run-id: 45973294553
          github-token: ${{ github.token }}
          path: sample
      - run: python -m pip install faster-whisper
      - name: Review actual test audio with second ASR model
        run: |
          python - <<'PY'
          import av,numpy as np,json
          from faster_whisper import WhisperModel
          resampler=av.AudioResampler(format='s16',layout='mono',rate=16000)
          pieces=[]
          total=0
          with av.open('sample/excerpt.mp4') as c:
              for frame in c.decode(audio=0):
                  for f in resampler.resample(frame):
                      a=f.to_ndarray().flatten()
                      pieces.append(a)
                      total+=len(a)
                  if total>=16000*60: break
          audio=np.concatenate(pieces).astype('float32')/32768.0
          model=WhisperModel('large-v3',device='cpu',compute_type='int8',cpu_threads=4)
          data=[]
          for a,b in [(19,29),(40,57.8)]:
              segs,_=model.transcribe(audio[int(a*16000):int(b*16000)],language='ar',word_timestamps=True,beam_size=5,condition_on_previous_text=False)
              for s in segs:
                  d=dict(start=s.start+a,end=s.end+a,text=s.text,words=[dict(start=w.start+a,end=w.end+a,word=w.word,probability=w.probability) for w in s.words or []])
                  data.append(d)
                  print(d,flush=True)
          with open('review.json','w',encoding='utf8') as f:json.dump(data,f,ensure_ascii=False,indent=2)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ecommerce-caption-review
          path: review.json
          retention-days: 1
