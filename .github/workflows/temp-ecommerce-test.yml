name: Ecommerce podcast test source retry
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/temp-ecommerce-test.yml'
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Start WARP proxy
        shell: bash
        run: |
          set -eu
          docker network create warp-net || true
          docker run -d --name warp --network warp-net -p 127.0.0.1:1080:1080 --cap-add NET_ADMIN --sysctl net.ipv6.conf.all.disable_ipv6=0 --sysctl net.ipv4.conf.all.src_valid_mark=1 caomingjun/warp
          for i in {1..20}; do
            RESULT=$(curl -s --max-time 4 --socks5-hostname 127.0.0.1:1080 https://cloudflare.com/cdn-cgi/trace || true)
            echo "$RESULT" | grep -qE 'warp=(on|plus)' && exit 0
            sleep 2
          done
          exit 1
      - name: Install tools
        run: |
          python -m pip install --pre -U 'yt-dlp[default]' faster-whisper
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> "$GITHUB_PATH"
      - name: Retrieve source and prepare test excerpt
        run: |
          set -euxo pipefail
          mkdir -p sample
          python -m yt_dlp --proxy 'socks5://127.0.0.1:1080' --remote-components ejs:github --js-runtimes deno --extractor-args 'youtube:player_client=web_embedded' --no-playlist -f 18 -o 'source.%(ext)s' 'https://www.youtube.com/watch?v=W2pwIKgQeWM' || python -m yt_dlp --no-playlist --js-runtimes deno --remote-components ejs:github -f 18 -o 'source.%(ext)s' 'https://www.youtube.com/watch?v=W2pwIKgQeWM'
          ffmpeg -hide_banner -loglevel error -y -ss 00:32:47 -i source.mp4 -t 240 -c:v libx264 -preset fast -crf 20 -c:a aac -b:a 128k sample/excerpt.mp4
          ffprobe -v error -show_format -show_streams sample/excerpt.mp4 > sample/probe.txt
      - name: Upload excerpt
        uses: actions/upload-artifact@v4
        with:
          name: W2pwIKgQeWM-test-source
          path: sample
          retention-days: 1
      - name: Transcribe excerpt with word timings
        run: |
          python - <<'PY'
          from faster_whisper import WhisperModel
          import json
          model=WhisperModel('large-v3-turbo',device='cpu',compute_type='int8',cpu_threads=4)
          segments, info=model.transcribe('sample/excerpt.mp4',language='ar',word_timestamps=True,beam_size=3,vad_filter=True)
          data=[]
          for s in segments:
              data.append(dict(start=s.start,end=s.end,text=s.text,words=[dict(start=w.start,end=w.end,word=w.word,probability=w.probability) for w in s.words or []]))
              print(s.start,s.end,s.text,flush=True)
          with open('sample/transcript.json','w',encoding='utf8') as f: json.dump(data,f,ensure_ascii=False,indent=2)
          PY
      - name: Upload transcription
        uses: actions/upload-artifact@v4
        with:
          name: W2pwIKgQeWM-test-transcript
          path: sample/transcript.json
          retention-days: 1
