name: Ecommerce test word timing
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/temp-ecommerce-test.yml'
permissions:
  contents: read
  actions: read
jobs:
  captions:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Retrieve existing video excerpt
        uses: actions/download-artifact@v4
        with:
          name: W2pwIKgQeWM-test-source
          run-id: 45973294553
          github-token: ${{ github.token }}
          path: sample
      - name: Install transcription dependencies
        run: python -m pip install faster-whisper
      - name: Transcribe audio with word timings
        run: |
          python - <<'PY'
          import av, numpy as np, json
          from faster_whisper import WhisperModel
          resampler=av.AudioResampler(format='s16',layout='mono',rate=16000)
          pieces=[]
          total=0
          with av.open('sample/excerpt.mp4') as container:
              for frame in container.decode(audio=0):
                  for f in resampler.resample(frame):
                      a=f.to_ndarray().flatten()
                      pieces.append(a)
                      total+=len(a)
                  if total>=16000*100: break
          audio=np.concatenate(pieces).astype('float32')/32768.0
          model=WhisperModel('large-v3-turbo',device='cpu',compute_type='int8',cpu_threads=4)
          segments,info=model.transcribe(audio,language='ar',word_timestamps=True,beam_size=3,vad_filter=True,condition_on_previous_text=False,initial_prompt='بودكاست تونسي، التجارة الإلكترونية في تونس، إيكوميرس، برودوي، ماركتينغ، كرياتيف، ستوك.')
          data=[]
          for s in segments:
              data.append(dict(start=s.start,end=s.end,text=s.text,words=[dict(start=w.start,end=w.end,word=w.word,probability=w.probability) for w in s.words or []]))
              print(s.start,s.end,s.text,flush=True)
          with open('transcript.json','w',encoding='utf8') as f: json.dump(data,f,ensure_ascii=False,indent=2)
          PY
      - name: Upload transcription
        uses: actions/upload-artifact@v4
        with:
          name: W2pwIKgQeWM-test-transcript
          path: transcript.json
          retention-days: 1
