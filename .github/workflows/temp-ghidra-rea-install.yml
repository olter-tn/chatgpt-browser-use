name: Temporary REA-compatible Ghidra 12.1.4 transfer

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/temp-ghidra-rea-install.yml'

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout transfer repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Guard temporary workflow deletion
        id: guard
        shell: bash
        run: |
          if [[ -f .github/workflows/temp-ghidra-rea-install.yml ]]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download and verify Ghidra 12.1.4
        if: steps.guard.outputs.proceed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          URL="https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.4_build/ghidra_12.1.4_PUBLIC_20260921.zip"
          SHA256="ddac49f903da9d5bac833e5cc79395098b9c33cfd3279be5f31bd00387d2d4db"
          curl -fL --retry 3 --retry-delay 2 "$URL" -o "$RUNNER_TEMP/ghidra-12.1.4.zip"
          echo "$SHA256  $RUNNER_TEMP/ghidra-12.1.4.zip" | sha256sum --check --status
          split -b 400M --numeric-suffixes=0 --suffix-length=2 "$RUNNER_TEMP/ghidra-12.1.4.zip" "$RUNNER_TEMP/ghidra1214-part-"
          ls -lh "$RUNNER_TEMP"/ghidra1214-part-*

      - name: Upload Ghidra 12.1.4 part 00
        if: steps.guard.outputs.proceed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ghidra-1214-part-00
          path: ${{ runner.temp }}/ghidra1214-part-00
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Upload Ghidra 12.1.4 part 01
        if: steps.guard.outputs.proceed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ghidra-1214-part-01
          path: ${{ runner.temp }}/ghidra1214-part-01
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
