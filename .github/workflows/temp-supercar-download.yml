name: Temporary Facebook reel capture

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/temp-supercar-download.yml'

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install browser tooling
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m pip install -U playwright requests
          python3 -m playwright install chromium
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Resolve and capture public reel
        shell: bash
        env:
          TARGET_URL: "https://www.facebook.com/share/v/19obzn32AE/"
        run: |
          set -euxo pipefail
          cat > /tmp/grab_fb.py <<'PY'
          import asyncio, html as htmlmod, json, os, re, sys
          from urllib.parse import urlparse
          import requests
          from playwright.async_api import async_playwright

          TARGET = os.environ["TARGET_URL"]
          KEYS = [
              "browser_native_hd_url","playable_url_quality_hd","hd_src_no_ratelimit","hd_src",
              "browser_native_sd_url","playable_url","sd_src_no_ratelimit","sd_src"
          ]

          def decode_fb(s):
              s = htmlmod.unescape(str(s))
              for _ in range(3):
                  try:
                      s = json.loads('"' + s.replace('\\', '\\\\').replace('"', '\\"') + '"')
                  except Exception:
                      break
              return s.replace('\\u0025','%').replace('\\u0026','&').replace('\\/','/').strip()

          def normalize_candidate(u):
              if not u:
                  return None
              u = htmlmod.unescape(str(u))
              u = u.replace('\\/','/').replace('\\u0026','&').replace('\\u0025','%')
              try:
                  u = bytes(u, 'utf-8').decode('unicode_escape')
              except Exception:
                  pass
              u = u.strip('"\' ')
              if u.startswith("https://") and "fbcdn.net" in u and ".mp4" in u:
                  return u
              return None

          def harvest(text):
              out = []
              for key in KEYS:
                  for m in re.finditer(r'"' + re.escape(key) + r'"\s*:\s*"([^"]+)"', text):
                      u = normalize_candidate(m.group(1))
                      if u: out.append(u)
              pats = [
                  r'https:\\/\\/[^"\'<>\s]*fbcdn\.net[^"\'<>\s]*?\.mp4[^"\'<>\s]*',
                  r'https://[^"\'<>\s]*fbcdn\.net[^"\'<>\s]*?\.mp4[^"\'<>\s]*'
              ]
              for pat in pats:
                  for x in re.findall(pat, text, flags=re.I):
                      u = normalize_candidate(x)
                      if u: out.append(u)
              seen = []
              for u in out:
                  if u not in seen:
                      seen.append(u)
              return seen

          async def main():
              candidates = []
              network = []
              async with async_playwright() as p:
                  browser = await p.chromium.launch(headless=True, args=[
                      "--no-sandbox","--disable-blink-features=AutomationControlled",
                      "--disable-dev-shm-usage"
                  ])
                  context = await browser.new_context(
                      user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/141.0.0.0 Safari/537.36",
                      locale="en-US",
                      viewport={"width":1280,"height":900}
                  )
                  page = await context.new_page()
                  def on_response(resp):
                      u = resp.url
                      if "fbcdn.net" in u and ".mp4" in u:
                          network.append(u)
                  page.on("response", on_response)
                  try:
                      await page.goto(TARGET, wait_until="domcontentloaded", timeout=90000)
                  except Exception as e:
                      print("goto warning:", repr(e))
                  await page.wait_for_timeout(8000)
                  print("FINAL_URL", page.url)
                  try:
                      await page.screenshot(path="facebook-page.png", full_page=False)
                  except Exception:
                      pass
                  text = await page.content()
                  open("facebook-page.html","w",encoding="utf-8").write(text)
                  candidates.extend(harvest(text))
                  try:
                      vals = await page.eval_on_selector_all("video", "els => els.flatMap(v => [v.src, v.currentSrc]).filter(Boolean)")
                      for u in vals:
                          n = normalize_candidate(u)
                          if n: candidates.append(n)
                  except Exception:
                      pass
                  try:
                      resources = await page.evaluate("performance.getEntriesByType('resource').map(e=>e.name)")
                      for u in resources:
                          n = normalize_candidate(u)
                          if n: candidates.append(n)
                  except Exception:
                      pass
                  for u in network:
                      n = normalize_candidate(u)
                      if n: candidates.append(n)
                  # Try starting the first visible video; the MP4 ticket is sometimes injected lazily.
                  try:
                      await page.evaluate("""() => { const v=document.querySelector('video'); if(v){v.muted=true; v.play().catch(()=>{});} }""")
                      await page.wait_for_timeout(5000)
                      text2 = await page.content()
                      candidates.extend(harvest(text2))
                      resources = await page.evaluate("performance.getEntriesByType('resource').map(e=>e.name)")
                      for u in resources:
                          n = normalize_candidate(u)
                          if n: candidates.append(n)
                  except Exception:
                      pass
                  await browser.close()

              uniq=[]
              for u in candidates:
                  if u not in uniq: uniq.append(u)
              open("candidates.txt","w",encoding="utf-8").write("\n".join(uniq))
              print("CANDIDATES", len(uniq))
              if not uniq:
                  raise SystemExit("No fbcdn MP4 candidate found")

              ua="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/141.0.0.0 Safari/537.36"
              for i,u in enumerate(uniq):
                  print("TRY", i, u[:240])
                  try:
                      with requests.get(u, headers={"User-Agent":ua,"Referer":"https://www.facebook.com/"}, stream=True, timeout=60) as r:
                          print("HTTP", r.status_code, r.headers.get("content-type"), r.headers.get("content-length"))
                          if r.status_code != 200:
                              continue
                          with open("facebook-reel.mp4","wb") as f:
                              for chunk in r.iter_content(1024*1024):
                                  if chunk: f.write(chunk)
                      if os.path.getsize("facebook-reel.mp4") > 100000:
                          print("DOWNLOADED_BYTES", os.path.getsize("facebook-reel.mp4"))
                          return
                  except Exception as e:
                      print("download error", repr(e))
              raise SystemExit("Candidates found but none downloaded")

          asyncio.run(main())
          PY
          python3 /tmp/grab_fb.py
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_name,codec_type,width,height -of json facebook-reel.mp4
          ls -lh facebook-reel.mp4 facebook-page.png candidates.txt

      - name: Transcribe reel audio
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m pip install -U faster-whisper 'av<19'
          cat > /tmp/transcribe.py <<'PY'
          import json
          from faster_whisper import WhisperModel
          model = WhisperModel("small.en", device="cpu", compute_type="int8")
          segments, info = model.transcribe("facebook-reel.mp4", beam_size=5, vad_filter=True)
          rows = []
          with open("transcript.txt", "w", encoding="utf-8") as out:
              for s in segments:
                  line = f"[{s.start:7.2f} - {s.end:7.2f}] {s.text.strip()}"
                  print(line)
                  out.write(line + "\n")
                  rows.append({"start": s.start, "end": s.end, "text": s.text.strip()})
          with open("transcript.json", "w", encoding="utf-8") as j:
              json.dump({"language": info.language, "duration": info.duration, "segments": rows}, j, ensure_ascii=False, indent=2)
          PY
          python3 /tmp/transcribe.py

      - name: Upload reel artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: facebook-reel-capture
          path: |
            facebook-reel.mp4
            facebook-page.png
            candidates.txt
            transcript.txt
            transcript.json
          if-no-files-found: warn
          retention-days: 1
