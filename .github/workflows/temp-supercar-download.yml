name: Temporary YouTube video download

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/temp-supercar-download.yml'

permissions:
  contents: read

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Start Cloudflare WARP SOCKS proxy
        shell: bash
        run: |
          set -euxo pipefail
          docker network create warp-net || true
          docker run -d \
            --name warp \
            --network warp-net \
            -p 1080:1080 \
            --cap-add NET_ADMIN \
            --sysctl net.ipv6.conf.all.disable_ipv6=0 \
            --sysctl net.ipv4.conf.all.src_valid_mark=1 \
            caomingjun/warp

          for i in {1..30}; do
            RESULT=$(curl -s --max-time 5 \
              --socks5-hostname 127.0.0.1:1080 \
              https://cloudflare.com/cdn-cgi/trace || true)
            echo "$RESULT"
            if echo "$RESULT" | grep -qE 'warp=(on|plus)'; then
              exit 0
            fi
            sleep 2
          done
          echo "Cloudflare WARP did not become ready" >&2
          exit 1

      - name: Install yt-dlp and Deno
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m pip install --user -U --pre 'yt-dlp[default]'
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> "$GITHUB_PATH"
          "$HOME/.deno/bin/deno" --version
          python3 -m yt_dlp --version

      - name: Download Balti - Ya Hasra
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m yt_dlp \
            --proxy 'socks5://127.0.0.1:1080' \
            --remote-components ejs:github \
            --js-runtimes deno \
            --extractor-args 'youtube:player_client=web_embedded' \
            --no-playlist \
            -f '18' \
            -o 'tS8nzAQg_8k.%(ext)s' \
            'https://www.youtube.com/watch?v=tS8nzAQg_8k'
          ls -lh tS8nzAQg_8k.*

      - name: Upload MP4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: tS8nzAQg_8k-video
          path: tS8nzAQg_8k.mp4
          if-no-files-found: error
          retention-days: 1
