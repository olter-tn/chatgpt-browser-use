name: Business reel licensed footage
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/temp-supercar-download.yml'
permissions:
  contents: read
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download directly licensed Pexels footage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p stock
          fetch_one() {
            ID="$1"; FPS="$2"; NAME="$3"
            for res in hd_1280_720 hd_1920_1080 sd_640_360; do
              for rate in "$FPS" 25 30 50 24; do
                URL="https://videos.pexels.com/video-files/${ID}/${ID}-${res}_${rate}fps.mp4"
                echo "Checking $URL"
                if curl -fLsS --retry 1 --max-time 40 "$URL" -o "stock/${NAME}.mp4" && test "$(wc -c < "stock/${NAME}.mp4")" -gt 100000; then
                  echo "Fetched ${NAME}: $(wc -c < "stock/${NAME}.mp4") bytes"
                  return 0
                fi
              done
            done
            rm -f "stock/${NAME}.mp4"
            echo "Could not fetch ${NAME}" >&2
            return 1
          }
          fetch_one 3255329 50 busy_laptop || true
          fetch_one 8939541 25 team_laptop || true
          fetch_one 7688066 30 team_office || true
          fetch_one 7792221 25 focused_work || true
          test "$(find stock -type f -name '*.mp4' | wc -l)" -ge 1
          ls -lh stock
      - name: Upload licensed stock video assets
        uses: actions/upload-artifact@v4
        with:
          name: reel01-pexels-stock
          path: stock/*.mp4
          if-no-files-found: error
          retention-days: 1
