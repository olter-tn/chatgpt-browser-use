name: Temporary Public Sewing PDF Download

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/temp-supercar-download.yml'

permissions:
  contents: read

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch public designer PDF
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p wearable_blanket_patterns
          curl --fail --location --retry 4 --retry-all-errors --max-time 120 \
            'https://www.e-patchesandcrests.com/ideas/resources/20240416-nw-wbrpdf_wool_campfire_blanket_patterns.pdf' \
            -o wearable_blanket_patterns/04_Campfire_Blanket_Poncho_Adult_and_Child.pdf
          test "$(head -c 4 wearable_blanket_patterns/04_Campfire_Blanket_Poncho_Adult_and_Child.pdf)" = '%PDF'
          python3 -m pip install -q pypdf
          python3 - <<'PY'
          from pypdf import PdfReader
          p='wearable_blanket_patterns/04_Campfire_Blanket_Poncho_Adult_and_Child.pdf'
          pdf=PdfReader(p)
          print('Pages:',len(pdf.pages))
          assert len(pdf.pages) == 2
          PY
      - name: Upload verified PDF
        uses: actions/upload-artifact@v4
        with:
          name: campfire-blanket-poncho-pattern-pdf
          path: wearable_blanket_patterns/*.pdf
          if-no-files-found: error
          retention-days: 1
