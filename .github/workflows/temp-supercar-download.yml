name: Temporary Cardboard Adventures design audit

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/temp-supercar-download.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install Playwright
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m pip install -U playwright
          python3 -m playwright install chromium

      - name: Capture pages, screenshots, and computed styles
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p site-audit
          cat > /tmp/audit.py <<'PY'
          import asyncio, json, os
          from playwright.async_api import async_playwright

          TARGETS = [
              ("home", "https://www.cardboardadventures.co.uk/"),
              ("patterns", "https://www.cardboardadventures.co.uk/patterns"),
              ("collections", "https://www.cardboardadventures.co.uk/patterns-c"),
              ("how-it-works", "https://www.cardboardadventures.co.uk/howdoesitwork"),
              ("about", "https://www.cardboardadventures.co.uk/about"),
              ("product-dragon", "https://www.cardboardadventures.co.uk/creations/create-a-dragon-head"),
              ("shows", "https://www.cardboardadventures.co.uk/ourshows"),
              ("contact", "https://www.cardboardadventures.co.uk/contact"),
          ]
          VIEWPORTS = [
              ("desktop", {"width": 1440, "height": 1100}),
              ("mobile", {"width": 390, "height": 844}),
          ]

          JS = r"""
          ({name,url,vpName,viewport}) => {
            const visible = el => {
              const r = el.getBoundingClientRect();
              const s = getComputedStyle(el);
              return r.width > 3 && r.height > 3 && s.display !== 'none' && s.visibility !== 'hidden';
            };
            const styleOf = el => {
              const s = getComputedStyle(el), r = el.getBoundingClientRect();
              return {
                tag: el.tagName.toLowerCase(),
                text: (el.innerText || el.getAttribute('aria-label') || el.getAttribute('alt') || '').trim().replace(/\s+/g,' ').slice(0,220),
                className: typeof el.className === 'string' ? el.className.slice(0,220) : '',
                id: el.id || '',
                role: el.getAttribute('role'),
                href: el.href || null,
                src: el.currentSrc || el.src || null,
                x: Math.round(r.x), y: Math.round(r.y), width: Math.round(r.width), height: Math.round(r.height),
                display: s.display, position: s.position, overflow: s.overflow,
                color: s.color, backgroundColor: s.backgroundColor,
                backgroundImage: s.backgroundImage === 'none' ? 'none' : s.backgroundImage.slice(0,300),
                fontFamily: s.fontFamily, fontSize: s.fontSize, fontWeight: s.fontWeight,
                fontStyle: s.fontStyle, lineHeight: s.lineHeight, letterSpacing: s.letterSpacing,
                textTransform: s.textTransform, textAlign: s.textAlign,
                textDecoration: s.textDecorationLine,
                border: s.border, borderRadius: s.borderRadius, boxShadow: s.boxShadow,
                padding: s.padding, margin: s.margin, gap: s.gap,
                opacity: s.opacity, cursor: s.cursor
              };
            };

            const selectors = [
              'header','nav','main','section','footer',
              'h1','h2','h3','h4','h5','h6','p','a','button','input','select','textarea',
              '[role="button"]','[role="navigation"]','[role="banner"]','[role="contentinfo"]',
              'img','svg'
            ];
            const sampled = [...document.querySelectorAll(selectors.join(','))]
              .filter(visible).slice(0,1000).map(styleOf);

            const sectionSelectors = 'header,footer,section,main>div,[data-testid*="section"],[data-testid*="strip"]';
            const sections = [...document.querySelectorAll(sectionSelectors)]
              .filter(visible).slice(0,180).map(styleOf);

            const root = getComputedStyle(document.documentElement);
            const customProps = {};
            for (const p of [...root]) if (p.startsWith('--')) customProps[p] = root.getPropertyValue(p).trim();

            const resourceNames = performance.getEntriesByType('resource').map(x=>x.name);
            const fontResources = resourceNames.filter(x => /\.(woff2?|ttf|otf)(\?|$)/i.test(x) || /fonts?/i.test(x)).slice(0,180);
            const cssResources = resourceNames.filter(x => /\.css(\?|$)/i.test(x)).slice(0,200);

            const body = getComputedStyle(document.body);
            return {
              name,url,vpName,viewport,title:document.title,
              pageSize:{width:document.documentElement.scrollWidth,height:document.documentElement.scrollHeight},
              bodyStyle:{color:body.color,backgroundColor:body.backgroundColor,fontFamily:body.fontFamily,fontSize:body.fontSize,lineHeight:body.lineHeight},
              customProps,sampled,sections,fontResources,cssResources,
              html: document.documentElement.outerHTML
            };
          }
          """

          async def main():
              async with async_playwright() as p:
                  browser = await p.chromium.launch(headless=True, args=["--no-sandbox"])
                  compact_all = []
                  for vp_name, viewport in VIEWPORTS:
                      context = await browser.new_context(viewport=viewport, device_scale_factor=1)
                      for name, url in TARGETS:
                          page = await context.new_page()
                          try:
                              await page.goto(url, wait_until="domcontentloaded", timeout=90000)
                          except Exception as e:
                              print("goto warning", name, repr(e))
                          await page.wait_for_timeout(5500)
                          for txt in ["Accept", "Accept All", "Allow all", "Got it", "OK"]:
                              try:
                                  btn = page.get_by_role("button", name=txt)
                                  if await btn.count():
                                      await btn.first.click(timeout=700)
                              except Exception:
                                  pass
                          await page.wait_for_timeout(800)
                          await page.screenshot(path=f"site-audit/{name}-{vp_name}.png", full_page=True)
                          data = await page.evaluate(JS, {"name":name,"url":url,"vpName":vp_name,"viewport":viewport})
                          with open(f"site-audit/{name}-{vp_name}.json","w",encoding="utf-8") as f:
                              json.dump(data,f,ensure_ascii=False,indent=2)
                          compact = dict(data)
                          compact.pop("html", None)
                          compact_all.append(compact)
                          await page.close()
                      await context.close()
                  with open("site-audit/summary.json","w",encoding="utf-8") as f:
                      json.dump(compact_all,f,ensure_ascii=False,indent=2)
                  await browser.close()

          asyncio.run(main())
          PY
          python3 /tmp/audit.py
          find site-audit -maxdepth 1 -type f -printf '%f %k KB\n' | sort

      - name: Upload audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: cardboard-adventures-design-audit
          path: site-audit/
          if-no-files-found: error
          retention-days: 1
