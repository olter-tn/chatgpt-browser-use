name: Reel 01 word-synced narration
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/temp-reel01-narration.yml'
permissions:
  contents: read
jobs:
  speak:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate narration with exact word boundaries
        run: |
          python3 -m pip install --user edge-tts
          python3 - <<'PY'
          import asyncio, edge_tts, json
          text = "Your business might be bleeding money, and your to-do list won't tell you. Watch three numbers: cost, deadlines, and quality. First, spot where spending spikes. Second, find tasks that keep slipping. Third, track what customers have to redo. Check them every week. Because if you don't measure the bottleneck, you'll keep paying for it."
          async def main():
              voice = edge_tts.Communicate(text, "en-US-GuyNeural", rate="+14%", boundary="WordBoundary")
              timings = []
              chunks = []
              types = {}
              async for event in voice.stream():
                  types[event["type"]] = types.get(event["type"], 0)+1
                  if event["type"]=="audio":
                      chunks.append(event["data"])
                  elif event["type"]=="WordBoundary":
                      timings.append({"word":event["text"],"start":event["offset"]/10_000_000,"duration":event["duration"]/10_000_000})
              with open("reel01_narration.mp3","wb") as fo: fo.write(b"".join(chunks))
              with open("reel01_words.json","w") as fo: json.dump({"source":text,"words":timings},fo,indent=2)
              print("Event types",types)
              print("Words",len(timings))
              print("Audio bytes",sum(map(len,chunks)))
              print("First",timings[:5])
              print("Last",timings[-5:])
              assert len(timings)>45 and len(chunks)>3
          asyncio.run(main())
          PY
      - name: Upload synchronized audio and timestamp data
        uses: actions/upload-artifact@v4
        with:
          name: reel01-synced-narration
          path: |
            reel01_narration.mp3
            reel01_words.json
          if-no-files-found: error
          retention-days: 1
