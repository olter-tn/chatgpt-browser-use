name: Temporary Instagram reel download
on:
  push:
    branches: [master]
    paths: ['.github/workflows/temp-instagram-download.yml']
permissions:
  contents: read
  statuses: write
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Publish run link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state=pending -f context=instagram-download -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" -f description='Reel workflow started'
      - name: Install downloader
        run: python3 -m pip install --user -U --pre 'yt-dlp[default]'
      - name: Retrieve reel
        shell: bash
        run: |
          set -eu
          URL='https://www.instagram.com/p/Der_moKoXdo/'
          if ! python3 -m yt_dlp --no-playlist --socket-timeout 15 --retries 1 -f 'b/bv*+ba' --merge-output-format mp4 -o 'Der_moKoXdo.%(ext)s' "$URL"; then
            docker run -d --name warp -p 1080:1080 --cap-add NET_ADMIN --sysctl net.ipv6.conf.all.disable_ipv6=0 --sysctl net.ipv4.conf.all.src_valid_mark=1 caomingjun/warp
            for i in {1..20}; do
              RESULT=$(curl -s --max-time 4 --socks5-hostname 127.0.0.1:1080 https://cloudflare.com/cdn-cgi/trace || true)
              echo "$RESULT"
              if echo "$RESULT" | grep -qE 'warp=(on|plus)'; then break; fi
              sleep 2
            done
            python3 -m yt_dlp --proxy socks5://127.0.0.1:1080 --no-playlist --socket-timeout 20 --retries 1 -f 'b/bv*+ba' --merge-output-format mp4 -o 'Der_moKoXdo.%(ext)s' "$URL"
          fi
          test -s Der_moKoXdo.mp4
      - name: Upload media
        uses: actions/upload-artifact@v4
        with:
          name: Der_moKoXdo-video
          path: Der_moKoXdo.mp4
          if-no-files-found: error
          retention-days: 1
      - name: Transcribe audio
        shell: bash
        run: |
          python3 -m venv /tmp/reel-env
          /tmp/reel-env/bin/pip install faster-whisper
          /tmp/reel-env/bin/python - <<'PY'
          from faster_whisper import WhisperModel
          model = WhisperModel("small", device="cpu", compute_type="int8")
          segments, info = model.transcribe("Der_moKoXdo.mp4", beam_size=5, vad_filter=False)
          with open("transcript.txt", "w", encoding="utf-8") as f:
              f.write(f"Detected language: {info.language} ({info.language_probability:.2f})\n")
              for s in segments:
                  line = f"[{s.start:.2f}–{s.end:.2f}] {s.text.strip()}"
                  print(line, flush=True)
                  f.write(line + "\n")
          PY
      - name: Upload transcript
        uses: actions/upload-artifact@v4
        with:
          name: Der_moKoXdo-transcript
          path: transcript.txt
          retention-days: 1
      - name: Publish final status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          STATE=failure
          if [ "$JOB_STATUS" = success ]; then STATE=success; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state="$STATE" -f context=instagram-download -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
