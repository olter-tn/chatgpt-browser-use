name: Temporary Blender 5.3 Linux transfer

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/temp-blender-transfer.yml'

permissions:
  contents: read

jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Download Blender official Linux x64 archive and split
        shell: bash
        run: |
          set -euxo pipefail
          FILE=blender-5.3.0-linux-x64.tar.xz
          URL="https://download.blender.org/release/Blender5.3/$FILE"
          curl -fL --retry 5 --retry-delay 3 --connect-timeout 30 "$URL" -o "$FILE"
          test "$(stat -c%s "$FILE")" -eq 406944100
          sha256sum "$FILE" > blender.sha256
          mkdir -p parts
          split -b 70M -d -a 2 "$FILE" parts/blender-part-
          ls -lh parts/
          test "$(find parts -type f | wc -l)" -eq 6
      - name: Upload part 00
        uses: actions/upload-artifact@v4
        with:
          name: blender-5-3-part-00
          path: |
            parts/blender-part-00
            blender.sha256
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - name: Upload part 01
        uses: actions/upload-artifact@v4
        with:
          name: blender-5-3-part-01
          path: parts/blender-part-01
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - name: Upload part 02
        uses: actions/upload-artifact@v4
        with:
          name: blender-5-3-part-02
          path: parts/blender-part-02
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - name: Upload part 03
        uses: actions/upload-artifact@v4
        with:
          name: blender-5-3-part-03
          path: parts/blender-part-03
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - name: Upload part 04
        uses: actions/upload-artifact@v4
        with:
          name: blender-5-3-part-04
          path: parts/blender-part-04
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - name: Upload part 05
        uses: actions/upload-artifact@v4
        with:
          name: blender-5-3-part-05
          path: parts/blender-part-05
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
